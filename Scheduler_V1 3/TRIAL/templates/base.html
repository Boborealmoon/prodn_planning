<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scheduler Lab{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            <div>
                <div class="brand-top">SCHEDULER</div>
                <div class="brand-bottom"><em>LAB</em></div>
            </div>
        </div>
        <div class="topnav">
            <a href="/" class="topnav-link {% if request.path == '/' %}active{% endif %}">Lab</a>
            <a href="/materials" class="topnav-link {% if request.path == '/materials' %}active{% endif %}">Materials</a>
            <a href="/data-management" class="topnav-link {% if request.path == '/data-management' %}active{% endif %}">Data Management</a>
        </div>
    </div>
</nav>
<main class="main-content">
    <div class="page-header">
        <div class="page-header-copy">
            <h1>{% block page_title %}{% endblock %}</h1>
        </div>
        <div class="page-actions">{% block page_actions %}{% endblock %}</div>
    </div>
    <script src="/static/js/utils.js?v=2"></script>
    <div class="page-body">
        {% block content %}{% endblock %}
    </div>
</main>

<div id="global-modal" class="modal-overlay" style="display:none">
  <div id="global-modal-box" class="modal-box">
    <div class="modal-header">
      <div id="modal-title"></div>
      <button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">x</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>

<script>
document.addEventListener('click', function (e) {
    const openDropdowns = document.querySelectorAll('details.dropdown[open]');
    openDropdowns.forEach(function (dropdown) {
        if (!dropdown.contains(e.target)) dropdown.removeAttribute('open');
    });
});
</script>

{% block scripts %}{% endblock %}
</body>
</html>
