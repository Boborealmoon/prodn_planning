{% extends "base.html" %}
{% block title %}History{% endblock %}
{% block page_title %}🗂️ Planning History{% endblock %}
{% block content %}
<div class="toolbar">
  <div class="toolbar-search">
    <input type="text" id="hist-ps" placeholder="Filter by PS ID..." oninput="loadHistory()">
  </div>
</div>
<div id="hist-wrap">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script>
async function loadHistory() {
  const ps = document.getElementById('hist-ps').value.trim();
  const data = await GET('/api/history' + (ps ? `?ps_id=${ps}` : ''));
  render(data);
}

function render(data) {
  const wrap = document.getElementById('hist-wrap');
  if (!data.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="icon">🗂️</div><p>No history records yet. Archive completed planning blocks to see them here.</p></div>';
    return;
  }
  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>
      <th>Archived At</th><th>PS ID</th><th>Part</th><th>Op No</th>
      <th>Machine</th><th>Date</th><th>Time</th><th>Qty</th><th>Actual Out</th>
    </tr></thead>
    <tbody>${data.map(r => `<tr>
      <td style="font-size:11px;color:var(--text3)">${(r.archived_at||'').split('.')[0]}</td>
      <td><strong>${r.ps_id||'–'}</strong></td>
      <td style="font-size:12px">${r.part_name||'–'}</td>
      <td>${r.op_no||'–'}</td>
      <td>${r.machine_code||'–'}</td>
      <td>${r.plan_date||'–'}</td>
      <td>${r.start_hhmm||'–'} – ${r.end_hhmm||'–'}</td>
      <td style="text-align:right">${fmt(r.row_qty)}</td>
      <td style="text-align:right;color:${r.row_actual>0?'var(--green)':'var(--text3)'}">${fmt(r.row_actual)}</td>
    </tr>`).join('')}
    </tbody>
  </table></div>`;
}

loadHistory();
</script>
{% endblock %}
