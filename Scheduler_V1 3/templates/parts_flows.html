{% extends "base.html" %}
{% block title %}Parts & Flows{% endblock %}
{% block page_title %}Parts & Flows{% endblock %}
{% block page_actions %}
<button class="btn btn-primary" onclick="openAddPart()">Add Part</button>
{% endblock %}
{% block content %}
<div style="display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 130px)">
  <!-- Parts list -->
  <div style="display:flex;flex-direction:column;gap:8px;overflow-y:auto">
    <div class="toolbar" style="margin:0;padding:10px">
      <div class="toolbar-search" style="flex:1">
        <input type="text" placeholder="Search parts..." id="part-search" oninput="filterParts()" style="width:100%">
      </div>
    </div>
    <div id="parts-list" class="table-wrap" style="flex:1;overflow-y:auto">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>
  <!-- Flow editor -->
  <div id="flow-editor" style="overflow-y:auto">
    <div class="empty-state" style="margin-top:80px">
      <div class="icon">PF</div>
      <p>Select a part to view and edit flows</p>
    </div>
  </div>
</div>

<script>
let parts = [];
let selectedPart = null;
let selectedFlow = null;
let editingSteps = [];

async function loadParts() {
  parts = await GET('/api/parts');
  renderPartsList();
}

function filterParts() {
  const q = document.getElementById('part-search').value.toLowerCase();
  renderPartsList(q);
}

function renderPartsList(q = '') {
  const el = document.getElementById('parts-list');
  const filtered = q ? parts.filter(p => p.part_name.toLowerCase().includes(q) || (p.part_desc||'').toLowerCase().includes(q)) : parts;
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state" style="padding:30px"><p>No parts found</p></div>`;
    return;
  }
  el.innerHTML = filtered.map(p => `
    <div class="part-item" id="part-item-${p.part_id}" onclick="selectPart(${p.part_id})"
      style="padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s;
      ${selectedPart === p.part_id ? 'background:var(--bg4);border-left:3px solid var(--accent)' : ''}">
      <div style="font-weight:600;font-size:13px">${p.part_name}</div>
      <div style="font-size:11px;color:var(--text3)">${p.part_desc||'No description'}</div>
      <div style="font-size:11px;color:var(--accent);margin-top:2px">${(p.flows||[]).length} flow(s)</div>
    </div>`).join('');
}

async function selectPart(partId) {
  selectedPart = partId;
  renderPartsList(document.getElementById('part-search').value.toLowerCase());
  const part = parts.find(p => p.part_id === partId);
  const flows = await GET(`/api/parts/${partId}/flows`);
  renderFlowEditor(part, flows);
}

function renderFlowEditor(part, flows) {
  const el = document.getElementById('flow-editor');
  const flowTabs = flows.map(f => `
    <button class="btn ${selectedFlow === f.bom_id ? 'btn-primary' : 'btn-ghost'} btn-sm"
      onclick="selectFlow(${f.bom_id}, ${JSON.stringify(flows.map(x=>x.bom_id))})">
      ${f.flow_code}${f.is_default ? ' Default' : ''}
    </button>`).join('');

  el.innerHTML = `
    <div class="panel">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <h3 style="font-size:15px">${part.part_name}</h3>
        <span style="color:var(--text3);font-size:13px">${part.part_desc||''}</span>
        <button class="btn btn-ghost btn-sm" onclick="editPart(${part.part_id})">Edit Part</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${flowTabs}
        <button class="btn btn-primary btn-sm" onclick="openAddFlow(${part.part_id})">Add Flow</button>
      </div>
    </div>
    <div id="flow-steps-panel">
      <div class="empty-state" style="padding:40px"><p>Select a flow to edit its steps</p></div>
    </div>`;
  
  if (flows.length) {
    const defaultFlow = flows.find(f => f.is_default) || flows[0];
    selectedFlow = defaultFlow.bom_id;
    renderFlowSteps(defaultFlow);
  }
}

function selectFlow(flowId, allIds) {
  selectedFlow = flowId;
  // Re-render tabs
  const btns = document.querySelectorAll('#flow-editor .btn');
  GET(`/api/parts/${selectedPart}/flows`).then(flows => {
    const flow = flows.find(f => f.bom_id === flowId);
    if (flow) renderFlowSteps(flow);
    // Update tab styles
    renderFlowEditor(parts.find(p => p.part_id === selectedPart), flows);
    selectedFlow = flowId;
    renderFlowSteps(flow);
  });
}

function renderFlowSteps(flow) {
  editingSteps = (flow.steps || []).map(s => ({...s}));
  const el = document.getElementById('flow-steps-panel');
  el.innerHTML = `
    <div class="panel">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="panel-title" style="margin:0">Flow: ${flow.flow_code}</div>
        ${flow.is_default ? '<span class="badge badge-green">Default</span>' : ''}
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn btn-sm btn-ghost" onclick="duplicateFlow(${flow.bom_id})">Duplicate</button>
          <button class="btn btn-sm btn-ghost" onclick="setDefault(${flow.bom_id})">Set Default</button>
          <button class="btn btn-sm btn-primary" onclick="saveFlow(${flow.bom_id})">Save Flow</button>
        </span>
      </div>
      <div style="margin-bottom:8px">
        <div class="field-row">
          <div class="field"><label>Flow Code</label><input id="fc-${flow.bom_id}" value="${flow.flow_code}"></div>
          <div class="field"><label>Flow Name</label><input id="fn-${flow.bom_id}" value="${flow.flow_name||''}"></div>
          <div class="field"><label>Default?</label>
            <select id="fd-${flow.bom_id}">
              <option value="0" ${!flow.is_default?'selected':''}>No</option>
              <option value="1" ${flow.is_default?'selected':''}>Yes (Default)</option>
            </select>
          </div>
        </div>
      </div>
      <div class="panel-title">Steps</div>
      <div id="steps-list-${flow.bom_id}"></div>
      <button class="btn btn-ghost btn-sm" onclick="addStep(${flow.bom_id})" style="margin-top:8px">Add Step</button>
    </div>`;
  renderStepsList(flow.bom_id);
}

function renderStepsList(flowId) {
  const container = document.getElementById(`steps-list-${flowId}`);
  if (!editingSteps.length) {
    container.innerHTML = '<div style="color:var(--text3);padding:8px">No steps. Add one below.</div>';
    return;
  }
  container.innerHTML = editingSteps.map((s, i) => `
    <div draggable="true" data-idx="${i}" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start">
      <div class="drag-handle" title="Drag to reorder">::</div>
      <div style="display:grid;grid-template-columns:80px 80px 120px 120px 80px 80px 140px 120px 40px;gap:8px;flex:1;align-items:center">
        <div>
          <div class="field-hint">Op No</div>
          <input value="${s.op_no}" onchange="editStep(${i},'op_no',this.value)" style="width:100%">
        </div>
        <div>
          <div class="field-hint">Op Type</div>
          <input value="${s.op_type}" onchange="editStep(${i},'op_type',this.value)" style="width:100%">
        </div>
        <div>
          <div class="field-hint">Machine Category</div>
          <input value="${s.machine_category}" onchange="editStep(${i},'machine_category',this.value)" style="width:100%">
        </div>
        <div>
          <div class="field-hint">Preferred Machine</div>
          <input value="${s.preferred_machine||''}" onchange="editStep(${i},'preferred_machine',this.value)" style="width:100%">
        </div>
        <div>
          <div class="field-hint">Cycle Time</div>
          <input type="number" step="0.1" min="0.1" value="${s.cycle_time}" onchange="editStep(${i},'cycle_time',parseFloat(this.value))" style="width:100%">
        </div>
        <div>
          <div class="field-hint">Setup Time</div>
          <input type="number" step="1" min="0" value="${s.setup_time||0}" onchange="editStep(${i},'setup_time',parseFloat(this.value))" style="width:100%">
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:14px">
          <label style="font-size:12px;display:flex;align-items:center;gap:4px">
            <input type="checkbox" ${s.is_last_op ? 'checked' : ''} onchange="editStep(${i},'is_last_op',this.checked?1:0)"> Last Op
          </label>
        </div>
        <div style="margin-top:14px">
          <button class="btn btn-sm btn-danger btn-icon" onclick="removeStep(${i},${flowId})" title="Delete">Delete</button>
        </div>
      </div>
    </div>`).join('');
  
  // Make sortable
  makeSortable(container, () => {
    const newOrder = [];
    container.querySelectorAll('[data-idx]').forEach(el => newOrder.push(editingSteps[parseInt(el.dataset.idx)]));
    editingSteps = newOrder;
    renderStepsList(flowId);
  });
}

function editStep(idx, field, value) {
  editingSteps[idx][field] = value;
}

function addStep(flowId) {
  const nextOp = editingSteps.length > 0
    ? String((parseInt(editingSteps[editingSteps.length-1].op_no) || editingSteps.length * 10) + 10)
    : '10';
  editingSteps.push({
    op_no: nextOp, op_type: '', machine_category: '', cycle_time: 1, setup_time: 0,
    preferred_machine: '', is_last_op: editingSteps.length === 0 ? 1 : 0
  });
  renderStepsList(flowId);
}

function removeStep(idx, flowId) {
  editingSteps.splice(idx, 1);
  renderStepsList(flowId);
}

async function saveFlow(flowId) {
  const data = {
    flow_code: document.getElementById(`fc-${flowId}`).value,
    flow_name: document.getElementById(`fn-${flowId}`).value,
    is_default: document.getElementById(`fd-${flowId}`).value === '1',
    steps: editingSteps
  };
  const lastOps = editingSteps.filter(s => s.is_last_op);
  if (lastOps.length !== 1) { toast('Flow must have exactly 1 last operation step', 'error'); return; }
  if (editingSteps.some(s => !s.cycle_time || s.cycle_time <= 0)) { toast('All steps must have cycle time > 0', 'error'); return; }
  if (editingSteps.some(s => !s.op_type)) { toast('All steps must have an op type', 'error'); return; }
  if (editingSteps.some(s => !s.machine_category)) { toast('All steps must have a machine category', 'error'); return; }
  try {
    await PUT(`/api/flows/${flowId}`, data);
    toast('Flow saved', 'success');
    parts = await GET('/api/parts');
    renderPartsList();
    selectPart(selectedPart);
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function duplicateFlow(flowId) {
  try {
    const res = await POST(`/api/flows/${flowId}/duplicate`, {});
    toast(`Flow duplicated as ${res.flow_code}`, 'success');
    selectPart(selectedPart);
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function setDefault(flowId) {
  // This is handled in save - just mark is_default=1 and save
  document.getElementById(`fd-${flowId}`).value = '1';
  await saveFlow(flowId);
}

function openAddPart() {
  openModal('Add Part', `
    <div class="field"><label>Part Name *</label><input id="new-part-name" placeholder="e.g. SHAFT-A100"></div>
    <div class="field"><label>Description</label><textarea id="new-part-desc" rows="2" placeholder="Optional description"></textarea></div>
    <div class="modal-footer" style="padding:0;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddPart()">Create Part</button>
    </div>`);
}

async function submitAddPart() {
  const name = document.getElementById('new-part-name').value.trim();
  if (!name) { toast('Part name required', 'error'); return; }
  try {
    await POST('/api/parts', { part_name: name, part_desc: document.getElementById('new-part-desc').value });
    toast('Part created', 'success');
    closeModal();
    parts = await GET('/api/parts');
    renderPartsList();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function editPart(partId) {
  const part = parts.find(p => p.part_id === partId);
  openModal('Edit Part', `
    <div class="field"><label>Part Name *</label><input id="ep-name" value="${part.part_name}"></div>
    <div class="field"><label>Description</label><textarea id="ep-desc">${part.part_desc||''}</textarea></div>
    <div class="modal-footer" style="padding:0;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitEditPart(${partId})">Save</button>
    </div>`);
}

async function submitEditPart(partId) {
  const name = document.getElementById('ep-name').value.trim();
  if (!name) return;
  await PUT(`/api/parts/${partId}`, { part_name: name, part_desc: document.getElementById('ep-desc').value });
  toast('Part updated', 'success');
  closeModal();
  parts = await GET('/api/parts');
  renderPartsList();
}

function openAddFlow(partId) {
  openModal('Add Flow', `
    <div class="field"><label>Flow Code *</label><input id="nf-code" placeholder="e.g. SHAFT-F1"></div>
    <div class="field"><label>Flow Name</label><input id="nf-name" placeholder="e.g. Standard Turning Flow"></div>
    <div class="field"><label>Default?</label>
      <select id="nf-default"><option value="0">No</option><option value="1">Yes</option></select>
    </div>
    <div class="modal-footer" style="padding:0;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddFlow(${partId})">Create Flow</button>
    </div>`);
}

async function submitAddFlow(partId) {
  const code = document.getElementById('nf-code').value.trim();
  if (!code) { toast('Flow code required', 'error'); return; }
  try {
    await POST('/api/flows', {
      part_id: partId, flow_code: code,
      flow_name: document.getElementById('nf-name').value,
      is_default: document.getElementById('nf-default').value === '1',
      steps: []
    });
    toast('Flow created', 'success');
    closeModal();
    selectPart(partId);
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

loadParts();
</script>
{% endblock %}
