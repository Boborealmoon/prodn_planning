{% extends "base.html" %}
{% block title %}Machines{% endblock %}
{% block page_title %}🏭 Machines{% endblock %}
{% block page_actions %}
<button class="btn btn-primary" onclick="openAddMachine()">Add Machine</button>
{% endblock %}
{% block content %}
<div class="table-wrap" id="machines-wrap">
  <div class="loading"><div class="spinner"></div></div>
</div>

<script>
let machines = [];

async function loadMachines() {
  machines = await GET('/api/machines');
  render();
}

function render() {
  const wrap = document.getElementById('machines-wrap');
  if (!machines.length) { wrap.innerHTML = '<div class="empty-state"><div class="icon">🏭</div><p>No machines defined</p></div>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>Code</th><th>Category</th><th>Shift Profile</th><th>Status</th><th>Notes</th><th>Actions</th>
    </tr></thead>
    <tbody>${machines.map(m => `
      <tr>
        <td><strong>${m.machine_code}</strong></td>
        <td>${m.machine_category}</td>
        <td>
          <span class="badge ${m.shift_profile === '24HR' ? 'badge-purple' : 'badge-blue'}">
            ${m.shift_profile === '24HR' ? '24HR' : 'STANDARD'}
          </span>
        </td>
        <td>${m.active ? '<span class="badge badge-green">Active</span>' : '<span class="badge badge-gray">Inactive</span>'}</td>
        <td style="color:var(--text3);font-size:12px">${m.notes||'–'}</td>
        <td>
          <div class="td-actions">
            <button class="btn btn-sm btn-ghost" onclick="editMachine(${m.machine_id})">✏ Edit</button>
            <button class="btn btn-sm ${m.active ? 'btn-warning' : 'btn-success'}" onclick="toggleActive(${m.machine_id}, ${m.active ? 0 : 1})">
              ${m.active ? '⏸ Deactivate' : '▶ Activate'}
            </button>
          </div>
        </td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function openAddMachine() {
  openModal('Add Machine', machineForm());
}

function machineForm(m = {}) {
  return `
    <div class="field-row">
      <div class="field"><label>Machine Code *</label><input id="mf-code" value="${m.machine_code||''}" placeholder="e.g. L001"></div>
      <div class="field"><label>Category *</label><input id="mf-cat" value="${m.machine_category||''}" placeholder="e.g. LATHE, MILL"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Shift Profile</label>
        <select id="mf-shift">
          <option value="STANDARD" ${(m.shift_profile||'STANDARD')==='STANDARD'?'selected':''}>STANDARD (08:30-20:00)</option>
          <option value="24HR" ${m.shift_profile==='24HR'?'selected':''}>24HR (continuous)</option>
        </select>
      </div>
      <div class="field"><label>Active</label>
        <select id="mf-active">
          <option value="1" ${m.active!==0?'selected':''}>Yes</option>
          <option value="0" ${m.active===0?'selected':''}>No</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="mf-notes" rows="2">${m.notes||''}</textarea></div>
    <div class="modal-footer" style="padding:0;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitMachine(${m.machine_id||''})">
        ${m.machine_id ? 'Save Changes' : 'Create Machine'}
      </button>
    </div>`;
}

async function submitMachine(machineId) {
  const body = {
    machine_code: document.getElementById('mf-code').value.trim(),
    machine_category: document.getElementById('mf-cat').value.trim().toUpperCase(),
    shift_profile: document.getElementById('mf-shift').value,
    active: parseInt(document.getElementById('mf-active').value),
    notes: document.getElementById('mf-notes').value,
  };
  if (!body.machine_code || !body.machine_category) { toast('Code and category required', 'error'); return; }
  try {
    if (machineId) await PUT(`/api/machines/${machineId}`, body);
    else await POST('/api/machines', body);
    toast('Machine saved', 'success');
    closeModal();
    loadMachines();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

function editMachine(id) {
  const m = machines.find(x => x.machine_id === id);
  openModal('Edit Machine', machineForm(m));
}

async function toggleActive(id, active) {
  const m = machines.find(x => x.machine_id === id);
  await PUT(`/api/machines/${id}`, {...m, active});
  loadMachines();
}

loadMachines();
</script>
{% endblock %}
