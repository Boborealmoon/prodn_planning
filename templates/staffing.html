{% extends "base.html" %}
{% block title %}Staffing{% endblock %}
{% block page_title %}Staffing{% endblock %}
{% block page_actions %}
<button class="btn btn-primary" onclick="openAddStaff()">Add Staff</button>
<button class="btn btn-ghost" onclick="openAssign()">Assign</button>
{% endblock %}
{% block content %}
<div class="toolbar">
  <div>
    <label style="font-size:12px;color:var(--text2)">From: </label>
    <input type="date" id="sf-from" onchange="loadStaffing()">
  </div>
  <div>
    <label style="font-size:12px;color:var(--text2)">To: </label>
    <input type="date" id="sf-to" onchange="loadStaffing()">
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div>
    <div class="panel">
      <div class="panel-title">Staff Members</div>
      <div id="staff-list" class="loading"><div class="spinner"></div></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <div class="panel-title">Machine Assignments</div>
      <div id="assign-list" class="loading"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script>
const today = new Date().toISOString().split('T')[0];
const toDate = new Date(); toDate.setDate(toDate.getDate() + 14);
document.getElementById('sf-from').value = today;
document.getElementById('sf-to').value = toDate.toISOString().split('T')[0];

let staffList = [];
let machinesList = [];

async function loadStaffing() {
  const from = document.getElementById('sf-from').value;
  const to = document.getElementById('sf-to').value;
  [staffList, machinesList] = await Promise.all([GET('/api/staff'), GET('/api/machines')]);
  const assignments = await GET(`/api/staffing?from=${from}&to=${to}`);
  renderStaff();
  renderAssignments(assignments);
}

function renderStaff() {
  const el = document.getElementById('staff-list');
  if (!staffList.length) { el.innerHTML = '<div class="empty-state" style="padding:20px"><p>No staff defined</p></div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Role</th><th>Actions</th></tr></thead>
    <tbody>${staffList.map(s => `<tr>
      <td>${s.staff_name}</td>
      <td><span class="badge ${s.role==='MACHINIST'?'badge-blue':'badge-purple'}">${s.role}</span></td>
      <td></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderAssignments(data) {
  const el = document.getElementById('assign-list');
  if (!data.length) { el.innerHTML = '<div class="empty-state" style="padding:20px"><p>No assignments in range</p></div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>Date</th><th>Machine</th><th>Staff</th><th>Role</th><th>Shift</th><th></th></tr></thead>
    <tbody>${data.map(a => `<tr>
      <td>${a.assign_date}</td>
      <td><strong>${a.machine_code}</strong><div style="font-size:11px;color:var(--text3)">${a.machine_category}</div></td>
      <td>${a.staff_name}</td>
      <td>${a.role}</td>
      <td>${a.shift}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteAssign(${a.assign_id})">Delete</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function openAddStaff() {
  openModal('Add Staff Member', `
    <div class="field"><label>Name *</label><input id="ns-name" placeholder="Full name"></div>
    <div class="field"><label>Role</label>
      <select id="ns-role">
        <option value="MACHINIST">Machinist</option>
        <option value="OPERATOR">Operator</option>
      </select>
    </div>
    <div class="modal-footer" style="padding:0;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddStaff()">Add</button>
    </div>`);
}

async function submitAddStaff() {
  const name = document.getElementById('ns-name').value.trim();
  if (!name) return;
  await POST('/api/staff', { staff_name: name, role: document.getElementById('ns-role').value });
  toast('Staff added', 'success');
  closeModal();
  loadStaffing();
}

function openAssign() {
  const machOpts = machinesList.filter(m => m.active).map(m => `<option value="${m.machine_id}">${m.machine_code} (${m.machine_category})</option>`).join('');
  const staffOpts = staffList.map(s => `<option value="${s.staff_id}">${s.staff_name} (${s.role})</option>`).join('');
  const today = new Date().toISOString().split('T')[0];
  openModal('Assign Staff to Machine', `
    <div class="field"><label>Date *</label><input type="date" id="as-date" value="${today}"></div>
    <div class="field"><label>Machine *</label><select id="as-machine"><option value="">-- Select --</option>${machOpts}</select></div>
    <div class="field"><label>Staff Member *</label><select id="as-staff"><option value="">-- Select --</option>${staffOpts}</select></div>
    <div class="field"><label>Shift</label>
      <select id="as-shift"><option>DAY</option><option>NIGHT</option></select>
    </div>
    <div class="modal-footer" style="padding:0;margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAssign()">Assign</button>
    </div>`);
}

async function submitAssign() {
  const body = {
    machine_id: document.getElementById('as-machine').value,
    staff_id: document.getElementById('as-staff').value,
    assign_date: document.getElementById('as-date').value,
    shift: document.getElementById('as-shift').value,
  };
  if (!body.machine_id || !body.staff_id || !body.assign_date) { toast('All fields required', 'error'); return; }
  try {
    await POST('/api/staffing', body);
    toast('Assigned', 'success');
    closeModal();
    loadStaffing();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function deleteAssign(id) {
  if (!confirm2('Remove this assignment?')) return;
  await DEL(`/api/staffing/${id}`);
  toast('Removed', 'info');
  loadStaffing();
}

loadStaffing();
</script>
{% endblock %}
